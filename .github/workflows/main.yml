name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python & Convert Bijoy JSON to Unicode
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Convert voters.json to Clean Bengali Unicode
        run: |
          pip install bijoy2unicode
          cat << 'EOF' > convert.py
          import json
          from bijoy2unicode import converter

          conv = converter.Unicode()

          with open("voters.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          for row in data:
              for key in ["name", "address"]:
                  if key in row and row[key]:
                      val = str(row[key])
                      # Keep pure English abbreviations like A.K.M. intact, convert Bijoy text
                      if not any('\u0980' <= c <= '\u09FF' for c in val):
                          row[key] = conv.convertBijoyToUnicode(val)

          with open("voters.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)

          print("Successfully converted", len(data), "records to Bengali Unicode!")
          EOF
          python convert.py

      - name: Arrange Android Project Structure
        run: |
          mkdir -p app/src/main/java/com/voterlist/app
          mkdir -p app/src/main/assets
          
          if [ -f "build.gradle" ]; then
            cp build.gradle app/build.gradle
            cat << 'EOF' >> app/build.gradle

          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = "1.8"
              }
          }
          EOF

            cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF
          fi

          [ -f "AndroidManifest.xml" ] && mv AndroidManifest.xml app/src/main/
          
          if [ -f "MainActivity.kt" ]; then
            PKG=$(grep -m 1 "^package " MainActivity.kt | awk '{print $2}' | tr '.' '/')
            if [ -n "$PKG" ]; then
              mkdir -p "app/src/main/java/$PKG"
              mv MainActivity.kt "app/src/main/java/$PKG/"
            else
              mv MainActivity.kt app/src/main/java/com/voterlist/app/
            fi
          fi

          [ -f "index.html" ] && mv index.html app/src/main/assets/
          [ -f "voters.json" ] && mv voters.json app/src/main/assets/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Voter-talika2-APK
          path: app/build/outputs/apk/debug/*.apk
